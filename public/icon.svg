<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rtuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Tech Ring -->
  <circle cx="256" cy="235" r="215" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Hexagonal Engineering Shield -->
  <polygon
    points="256,45 445,154 445,372 256,481 67,372 67,154"
    fill="#081026"
    stroke="url(#rtuGrad)"
    stroke-width="12"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Inner Hexagon Frame -->
  <polygon
    points="256,72 418,165 418,353 256,446 94,353 94,165"
    fill="none"
    stroke="#0284c7"
    stroke-width="3"
    stroke-opacity="0.35"
  />

  <!-- ================= MONOGRAM: R T U ================= -->
  <!-- Top T Bar -->
  <rect x="150" y="145" width="212" height="34" rx="8" fill="url(#rtuGrad)"/>

  <!-- Vertical Stem of T & R -->
  <rect x="180" y="145" width="38" height="205" rx="8" fill="url(#rtuGrad)"/>

  <!-- Upper Loop of R -->
  <path
    d="M 210 145 L 290 145 C 345 145, 365 175, 365 212 C 365 248, 345 275, 290 275 L 210 275 Z"
    fill="none"
    stroke="url(#rtuGrad)"
    stroke-width="34"
    stroke-linejoin="round"
  />

  <!-- Diagonal Leg of R -->
  <path
    d="M 270 262 L 345 350"
    stroke="url(#rtuGrad)"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- Dynamic Golden Chevron (U for Utama & Cooling Flow) -->
  <path
    d="M 155 315 L 256 395 L 357 315"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtitle Ribbon -->
  <g transform="translate(256, 435)">
    <rect x="-140" y="-18" width="280" height="36" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="7" font-family="'JetBrains Mono', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4">RUSTANDI</text>
  </g>
</svg>
